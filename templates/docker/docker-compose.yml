services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      # UTF8 só vale na primeira criação do volume (database/DATABASE.md).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      # 127.0.0.1: só este computador acessa; outros aparelhos da rede não.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/node
      target: dev
    environment:
      NODE_ENV: development
      PORT: 4000
      # A aplicação conecta com um usuário que não é dono das tabelas, para o isolamento
      # entre grupos (RLS) valer de fato. Migrations e dados de exemplo usam o dono.
      DATABASE_URL: postgresql://${APP_DB_USER:-app_runtime}:${APP_DB_PASSWORD:-app_runtime}@postgres:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER:-app_runtime}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app_runtime}
      # Papel de demonstração (cabeçalho x-demo-role). Só para ambiente local; a API recusa em produção.
      DEMO_IDENTITY_ENABLED: ${DEMO_IDENTITY_ENABLED:-false}
      # Banco separado para testes de integração (o Prisma o cria se não existir).
      TEST_DATABASE_URL: postgresql://${APP_DB_USER:-app_runtime}:${APP_DB_PASSWORD:-app_runtime}@postgres:5432/${POSTGRES_DB}_test
      TEST_MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}_test
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    volumes:
      - ./backend/node:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  web:
    build:
      context: ./frontend/react
      target: dev
    environment:
      # O Vite repassa /api e /health para a API: o navegador fala só com a porta da tela (sem CORS).
      API_PROXY_TARGET: http://api:4000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./frontend/react:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  postgres_data:
  api_node_modules:
  web_node_modules:
